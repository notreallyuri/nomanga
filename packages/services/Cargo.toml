[package]
name = "nomanga-services"
version.workspace = true
edition = "2024"
description = "SQLite persistence for nomanga: library, history, downloads, settings"
repository.workspace = true
license.workspace = true
# Deliberately not on crates.io: the public API here is really the app's schema,
# so it churns with every feature. A split-out client consumes it by git tag.
publish = false

[features]
typescript = ["dep:specta"]

[dependencies]
nomanga-core = { path = "../core", version = "0.1.0" }

serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt", "macros", "fs", "process", "time"] }
thiserror = "2"
sha2 = "0.10"
argon2 = { version = "0.5", features = ["std"] }
password-hash = { version = "0.5", features = ["getrandom"] }
flate2 = "1"
gethostname = "1"

chrono = { version = "0.4", features = ["serde"]}
uuid = { version = "1", features = ["v4"] }


sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono"] }
specta = { version = "2.0.0-rc.25", features = ["chrono", "function", "derive"], optional = true }
