[package]
name = "nomanga-sdk"
version = "0.1.0"
edition = "2024"
description = "Guest-side SDK for writing nomanga source extensions"
repository = "https://github.com/notreallyuri/nomanga"
# license = "..."   # required before this can be published to crates.io

[dependencies]
# The version is what a crates.io release would resolve against; the path wins
# for in-workspace builds and for anyone depending on this crate via git.
nomanga-core = { path = "../core", version = "0.1.0" }
extism-pdk = "1.4"
scraper = "0.27"
percent-encoding = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
