[package]
name = "nomanga-host"
version.workspace = true
edition = "2024"
description = "Extism host that loads and runs nomanga source extensions"
repository.workspace = true
license.workspace = true

[dependencies]
nomanga-core = { path = "../core", version = "0.1.0" }
extism = "1.30"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
