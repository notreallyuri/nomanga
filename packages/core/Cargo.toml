[package]
name = "nomanga-core"
version = "0.1.0"
edition = "2024"
description = "Shared data model and extension ABI for nomanga"
repository = "https://github.com/notreallyuri/nomanga"
# license = "..."   # required before this can be published to crates.io

[features]
typescript = ["dep:specta", "dep:specta-typescript"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

specta = { version = "2.0.0-rc.25", features = ["derive"], optional = true }
specta-typescript = { version = "0.0.12", optional = true }
