name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # Made up front so the three build jobs have something to upload into; letting
  # them each create-or-update races when they finish close together.
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: [create-release]
    # create-release is skipped on a manual run, which would otherwise skip this
    # job too.
    if: always() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned rather than ubuntu-latest: the glibc the deb and AppImage are
          # linked against is the oldest system they will run on, so it should
          # move when we decide to, not when the label is repointed.
          - platform: ubuntu-24.04
            name: linux
            args: ""
            bundle: target/release/bundle
          - platform: macos-latest
            name: macos
            args: --target universal-apple-darwin
            bundle: target/universal-apple-darwin/release/bundle
          - platform: windows-latest
            name: windows
            args: ""
            bundle: target/release/bundle

    runs-on: ${{ matrix.platform }}

    env:
      # packages/services uses sqlx's compile-time-checked macros. There is no
      # database in CI, so the macros must expand from the committed .sqlx cache.
      SQLX_OFFLINE: true

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            patchelf \
            rpm

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: ${{ matrix.name }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: client

      - name: Build
        run: pnpm tauri build ${{ matrix.args }}
        working-directory: client

      # Kept for manual runs, which have no release to upload into.
      - uses: actions/upload-artifact@v4
        with:
          name: nomanga-${{ matrix.name }}
          path: |
            ${{ matrix.bundle }}/deb/*.deb
            ${{ matrix.bundle }}/rpm/*.rpm
            ${{ matrix.bundle }}/appimage/*.AppImage
            ${{ matrix.bundle }}/dmg/*.dmg
            ${{ matrix.bundle }}/nsis/*.exe
            ${{ matrix.bundle }}/msi/*.msi
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          shopt -s nullglob
          files=(
            "$BUNDLE"/deb/*.deb
            "$BUNDLE"/rpm/*.rpm
            "$BUNDLE"/appimage/*.AppImage
            "$BUNDLE"/dmg/*.dmg
            "$BUNDLE"/nsis/*.exe
            "$BUNDLE"/msi/*.msi
          )
          [[ ${#files[@]} -gt 0 ]] || { echo "no bundles found under $BUNDLE" >&2; exit 1; }
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ matrix.bundle }}
