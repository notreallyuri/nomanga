[package]
name = "nomanga-cli"
version.workspace = true
edition = "2024"
description = "Run and package nomanga source extensions without the app"
repository.workspace = true
license.workspace = true

[dependencies]
nomanga-core = { path = "../packages/core" }
nomanga-host = { path = "../packages/host" }

clap = { version = "4.5", features = ["derive"]}
serde = { workspace = true }
serde_json = { workspace = true }
ureq = "3"
base64 = "0.23.0"
image = { version = "0.25.10", default-features = false, features = ["ico", "png", "jpeg", "webp"] }
