[workspace]
resolver = "3"
members = ["client/src-tauri", "packages/*", "cli"]
default-members = ["client/src-tauri", "packages/*", "cli"]

# The shipped app is one binary, so the crates inside it carry one version: the
# release. `core` and `sdk` opt out — they are the pair extension authors would
# pin from crates.io, so they need to move on their own.
[workspace.package]
version = "0.1.0"
license = "Apache-2.0"
repository = "https://github.com/notreallyuri/nomanga"

[profile.release]
lto = true
opt-level = "z"
strip = true

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
derive_more = { version = "2.1.1", features = ["display", "from_str", "into"] }
validator = { version = "0.20.0", features = ["derive"] }
