[package]
name = "nomanga-client"
version.workspace = true
description = "nomanga desktop app"
edition = "2021"
repository.workspace = true
license.workspace = true
publish = false

[profile.dev]
debug = true

[lib]
name = "nomanga_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

nomanga-core = { path = "../../packages/core", features = ["typescript"] }
nomanga-services =  { path = "../../packages/services", features = ["typescript"] }
nomanga-host = { path = "../../packages/host"}

tauri-specta = { version = "2.0.0-rc.25", features = ["derive", "typescript"] }
specta = { version = "2.0.0-rc.25", features = ["derive", "collect"] }
specta-typescript = "0.0.12"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
tokio = { version = "1", features = ["full"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "stream"] }
percent-encoding = "2"
chrono = "0.4"
getrandom = "0.3"
futures-util = { version = "0.3.33", default-features = false, features = ["std"] }
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-single-instance = { version = "2.4.3", features = ["deep-link"] }
tauri-plugin-os = "2"

# Only for asking the process heap to give its free lists back -- see
# `memory::release_to_os`.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }
